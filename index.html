<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Minha Realidade Aumentada</title>

  <script src="https://aframe.io/releases/0.6.0/aframe.min.js"></script>
  <script src="https://jeromeetienne.github.io/AR.js/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

  <a-scene embedded arjs>
    
   <a-sphere
      position="0 0.5 0"
      color="#4CAF50"
      scale="0.5 0.5 0.5">
   </a-sphere>
    
    <a-text
  value="The world round and round"
  position="0 1.6 0"
  rotation="-90 0 0"
  color="blue"
  align="center"
  width="4"
  font="exo2bold">
</a-text>

    <a-marker-camera preset="hiro"></a-marker-camera>
  </a-scene>

</body>
</html>
